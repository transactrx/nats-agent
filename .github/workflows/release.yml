name: Release

# Go libraries are consumed straight from the module proxy by tag, so a
# release is: verify the tagged commit passes the full suite, then publish a
# GitHub Release with generated notes. Tag with `git tag vX.Y.Z && git push
# origin vX.Y.Z`.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Test & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Run tests
        run: go test -race ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
