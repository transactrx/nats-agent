# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.5

    - name: Build
      run: go build -v ./...

    # The e2e suite runs against an embedded nats-server — no docker needed.
    # TODO: restore -race once nats-service ships the endpointStats fix
    # (transactrx/nats-service#107) and we bump past v1.4.45.
    - name: Run tests
      run: go test -v ./...
